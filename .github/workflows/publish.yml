on:
  push:
    branches: [main]
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Sobald R/Python/Julia-Code in .qmd-Dateien ausgeführt wird, hier
      # zusätzlich actions/setup-r bzw. actions/setup-python + Paketinstallation
      # ergänzen (siehe https://quarto.org/docs/publishing/ci.html).

      - name: Render and Publish to Netlify
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: netlify
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
